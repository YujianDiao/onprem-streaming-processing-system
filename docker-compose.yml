# Main Docker Compose file for On-Prem Data Streaming Platform
# This is a comprehensive setup for PoC environments

services:
  # ==========================================
  # KAFKA BROKER 1 (KRaft Mode - No Zookeeper)
  # ==========================================
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-1:29092,CONTROLLER://kafka-1:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================
  # KAFKA BROKER 2 (KRaft Mode - No Zookeeper)
  # ==========================================
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "9093:9093"
      - "19093:19093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-2:29092,CONTROLLER://kafka-2:29093,PLAINTEXT_HOST://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
      KAFKA_JMX_PORT: 9102
      KAFKA_JMX_HOSTNAME: kafka-2
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================
  # KAFKA BROKER 3 (KRaft Mode - No Zookeeper)
  # ==========================================
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "9094:9094"
      - "19094:19094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-3:29092,CONTROLLER://kafka-3:29093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
      KAFKA_JMX_PORT: 9103
      KAFKA_JMX_HOSTNAME: kafka-3
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================
  # SCHEMA REGISTRY - Kafka Schema Management
  # ==========================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-1:29092,kafka-2:29092,kafka-3:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: WARN
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # KAFKA UI - Web Interface for Kafka
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lakehouse-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # DATA GENERATOR - Fake Streaming Data
  # ==========================================
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    hostname: data-generator
    container_name: data-generator
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka-1:29092,kafka-2:29092,kafka-3:29092'
      SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      KAFKA_TOPIC: 'banking.transactions.raw'
      GENERATION_INTERVAL_MS: 2000
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # POSTGRESQL - Hive Metastore (for Trino/Iceberg)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
      POSTGRES_DB: metastore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # HIVE METASTORE - Metadata for Iceberg
  # ==========================================
  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    image: custom-hive-metastore:4.0.0
    hostname: hive-metastore
    container_name: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive123"
      HADOOP_OPTS: "-Dfs.s3a.endpoint=http://minio:9000 -Dfs.s3a.access.key=minioadmin -Dfs.s3a.secret.key=minioadmin -Dfs.s3a.path.style.access=true -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem"
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # MINIO - S3-Compatible Object Storage
  # ==========================================
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    volumes:
      - minio-data:/data
    networks:
      - data-platform
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MINIO CLIENT - Initialize Buckets
  # ==========================================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse;
      /usr/bin/mc mb --ignore-existing myminio/raw-data;
      /usr/bin/mc mb --ignore-existing myminio/backups;
      /usr/bin/mc mb --ignore-existing myminio/warehouse;
      /usr/bin/mc anonymous set download myminio/lakehouse;
      exit 0;
      "
    networks:
      - data-platform

  # ==========================================
  # SPARK MASTER
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    hostname: spark-master
    container_name: spark-master
    ports:
      - "7077:7077"
      - "8888:8080"
    user: root
    command: >
      bash -c "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*"
    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark/jars:/opt/spark/custom-jars
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # SPARK WORKER 1
  # ==========================================
  spark-worker-1:
    image: apache/spark:3.5.0
    hostname: spark-worker-1
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8091:8091"
    user: root
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --webui-port 8091 && tail -f /opt/spark/logs/*"
    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark/jars:/opt/spark/custom-jars
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # SPARK WORKER 2
  # ==========================================
  spark-worker-2:
    image: apache/spark:3.5.0
    hostname: spark-worker-2
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8092:8092"
    user: root
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --webui-port 8092 && tail -f /opt/spark/logs/*"
    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark/jars:/opt/spark/custom-jars
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # TRINO - Distributed SQL Query Engine
  # ==========================================
  trino:
    image: trinodb/trino:latest
    hostname: trino
    container_name: trino
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    ports:
      - "8086:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # PROMETHEUS - Metrics Collection
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # GRAFANA - Monitoring Dashboards
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # FLINK JOBMANAGER - Flink Cluster Master
  # ==========================================
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: custom-flink:1.18.0
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - "8081:8081"  # Flink Web UI
      - "6123:6123"  # Flink RPC
      - "9249:9249"  # Prometheus metrics
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    command: jobmanager
    volumes:
      - ./flink/conf:/opt/flink/conf
      - ./flink/jobs:/opt/flink-jobs
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
    networks:
      - data-platform
    depends_on:
      - kafka-1
      - minio
      - hive-metastore
    restart: unless-stopped

  # ==========================================
  # FLINK TASKMANAGER 1 - Flink Worker Node
  # ==========================================
  flink-taskmanager-1:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: custom-flink:1.18.0
    hostname: flink-taskmanager-1
    container_name: flink-taskmanager-1
    ports:
      - "6121:6121"  # RPC port
      - "6122:6122"  # Data port
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    command: taskmanager
    volumes:
      - ./flink/conf:/opt/flink/conf
      - ./flink/jobs:/opt/flink-jobs
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
    networks:
      - data-platform
    depends_on:
      - flink-jobmanager
    restart: unless-stopped

  # ==========================================
  # FLINK TASKMANAGER 2 - Flink Worker Node
  # ==========================================
  flink-taskmanager-2:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: custom-flink:1.18.0
    hostname: flink-taskmanager-2
    container_name: flink-taskmanager-2
    ports:
      - "6131:6121"  # RPC port
      - "6132:6122"  # Data port
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    command: taskmanager
    volumes:
      - ./flink/conf:/opt/flink/conf
      - ./flink/jobs:/opt/flink-jobs
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
    networks:
      - data-platform
    depends_on:
      - flink-jobmanager
    restart: unless-stopped

  # ==========================================
  # APACHE SUPERSET - Data Visualization & BI
  # ==========================================
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: custom-superset:latest
    hostname: superset
    container_name: superset
    depends_on:
      - trino
      - postgres
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=thisISaSECRET_1234
      - TALISMAN_ENABLED=False
    volumes:
      - superset-data:/app/superset_home
    networks:
      - data-platform
    restart: unless-stopped
    command: >
      sh -c "superset db upgrade &&
             superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
             superset init &&
             superset run -h 0.0.0.0 -p 8088 --with-threads --reload"

  # ==========================================
  # CADVISOR - Container Metrics
  # ==========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    hostname: cadvisor
    container_name: cadvisor
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - data-platform
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg

  # ==========================================
  # NODE EXPORTER - Host System Metrics
  # ==========================================
  node-exporter:
    image: prom/node-exporter:latest
    hostname: node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - data-platform
    restart: unless-stopped

  # ==========================================
  # POSTGRES EXPORTER - PostgreSQL Metrics
  # ==========================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    hostname: postgres-exporter
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://hive:hive123@postgres:5432/metastore?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - data-platform
    depends_on:
      - postgres
    restart: unless-stopped

  # ==========================================
  # KAFKA JMX EXPORTERS - Kafka Metrics
  # ==========================================
  kafka-jmx-exporter-1:
    image: bitnami/jmx-exporter:latest
    hostname: kafka-jmx-exporter-1
    container_name: kafka-jmx-exporter-1
    ports:
      - "10001:5556"
    environment:
      - SERVICE_PORT=5556
    volumes:
      - ./monitoring/jmx-exporter/kafka-1-config.yml:/etc/jmx-exporter/config.yml
    command:
      - "5556"
      - "/etc/jmx-exporter/config.yml"
    networks:
      - data-platform
    depends_on:
      - kafka-1
    restart: unless-stopped

  kafka-jmx-exporter-2:
    image: bitnami/jmx-exporter:latest
    hostname: kafka-jmx-exporter-2
    container_name: kafka-jmx-exporter-2
    ports:
      - "10002:5556"
    environment:
      - SERVICE_PORT=5556
    volumes:
      - ./monitoring/jmx-exporter/kafka-2-config.yml:/etc/jmx-exporter/config.yml
    command:
      - "5556"
      - "/etc/jmx-exporter/config.yml"
    networks:
      - data-platform
    depends_on:
      - kafka-2
    restart: unless-stopped

  kafka-jmx-exporter-3:
    image: bitnami/jmx-exporter:latest
    hostname: kafka-jmx-exporter-3
    container_name: kafka-jmx-exporter-3
    ports:
      - "10003:5556"
    environment:
      - SERVICE_PORT=5556
    volumes:
      - ./monitoring/jmx-exporter/kafka-3-config.yml:/etc/jmx-exporter/config.yml
    command:
      - "5556"
      - "/etc/jmx-exporter/config.yml"
    networks:
      - data-platform
    depends_on:
      - kafka-3
    restart: unless-stopped

  # ==========================================
  # DATAHUB - Data Catalog & Governance
  # (Optional - Resource Intensive)
  # ==========================================
  datahub-mysql:
    image: mysql:8.0
    hostname: datahub-mysql
    container_name: datahub-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: datahub
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
    volumes:
      - datahub-mysql-data:/var/lib/mysql
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - datahub

  datahub-elasticsearch:
    image: elasticsearch:7.17.9
    hostname: datahub-elasticsearch
    container_name: datahub-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - datahub-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - data-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - datahub

  datahub-gms:
    image: acryldata/datahub-gms:latest
    hostname: datahub-gms
    container_name: datahub-gms
    depends_on:
      datahub-mysql:
        condition: service_healthy
      datahub-elasticsearch:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      - DATAHUB_SERVER_TYPE=gms
      - DATAHUB_ANALYTICS_ENABLED=true
      - EBEAN_DATASOURCE_USERNAME=datahub
      - EBEAN_DATASOURCE_PASSWORD=datahub
      - EBEAN_DATASOURCE_URL=jdbc:mysql://datahub-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8
      - KAFKA_BOOTSTRAP_SERVER=kafka-1:29092
      - ELASTICSEARCH_HOST=datahub-elasticsearch
      - ELASTICSEARCH_PORT=9200
    networks:
      - data-platform
    restart: unless-stopped
    profiles:
      - datahub

  datahub-frontend:
    image: acryldata/datahub-frontend-react:latest
    hostname: datahub-frontend
    container_name: datahub-frontend
    depends_on:
      - datahub-gms
    ports:
      - "9002:9002"
    environment:
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8080
      - DATAHUB_SECRET=YouKnowNothing
      - DATAHUB_APP_VERSION=1.0
      - DATAHUB_PLAY_MEM_BUFFER_SIZE=10MB
    networks:
      - data-platform
    restart: unless-stopped
    profiles:
      - datahub

# ==========================================
# NETWORKS
# ==========================================
networks:
  data-platform:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==========================================
# VOLUMES
# ==========================================
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  superset-data:
  datahub-mysql-data:
  datahub-elasticsearch-data:
  flink-checkpoints:
  flink-savepoints:
