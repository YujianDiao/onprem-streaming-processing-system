global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'data-platform'
    environment: 'poc'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # ==================================================
  # CORE MONITORING SERVICES
  # ==================================================

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # ==================================================
  # INFRASTRUCTURE METRICS
  # ==================================================

  # cAdvisor - Container metrics for ALL containers
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'container-metrics'

  # Node Exporter - Host system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  # ==================================================
  # DATA PLATFORM SERVICES
  # ==================================================

  # MinIO Object Storage
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    bearer_token: 'eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwcm9tZXRoZXVzIiwic3ViIjoibWluaW9hZG1pbiIsImV4cCI6NDkxNjg5MTE0M30.-e6j9gQsDngdGtj-pJQA7VPcVOTo4xjgQX-CZOLb9UgwjvakrN3XZruGwG0f4JY2ND2eLM70OuIZMM8jA_ygTg'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'

  # PostgreSQL Exporter - Hive Metastore Database
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'metastore'

  # ==================================================
  # KAFKA CLUSTER METRICS (via JMX Exporter)
  # ==================================================

  # Kafka Broker 1
  - job_name: 'kafka-broker-1'
    static_configs:
      - targets: ['kafka-jmx-exporter-1:5556']
        labels:
          service: 'kafka'
          broker_id: '1'
          broker_host: 'kafka-1'

  # Kafka Broker 2
  - job_name: 'kafka-broker-2'
    static_configs:
      - targets: ['kafka-jmx-exporter-2:5556']
        labels:
          service: 'kafka'
          broker_id: '2'
          broker_host: 'kafka-2'

  # Kafka Broker 3
  - job_name: 'kafka-broker-3'
    static_configs:
      - targets: ['kafka-jmx-exporter-3:5556']
        labels:
          service: 'kafka'
          broker_id: '3'
          broker_host: 'kafka-3'

  # ==================================================
  # SPARK CLUSTER METRICS (Future - Requires Config)
  # ==================================================

  # Note: Spark metrics require additional configuration in metrics.properties
  # Uncomment these after configuring Spark metrics sink

  # - job_name: 'spark-master'
  #   metrics_path: /metrics/prometheus
  #   static_configs:
  #     - targets: ['spark-master:8080']
  #       labels:
  #         service: 'spark'
  #         component: 'master'

