global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'data-platform'
    environment: 'poc'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # MinIO metrics - DISABLED (requires AWS4-HMAC-SHA256 authentication)
  # MinIO requires bearer token or AWS signature for metrics endpoint
  # To enable: Set MINIO_PROMETHEUS_AUTH_TYPE=public in MinIO environment
  # See MONITORING_ENHANCEMENTS.md for details
  #
  # - job_name: 'minio'
  #   metrics_path: /minio/v2/metrics/cluster
  #   scheme: http
  #   bearer_token: 'your-prometheus-bearer-token'
  #   static_configs:
  #     - targets: ['minio:9000']
  #       labels:
  #         service: 'minio'

  # Docker container metrics via cAdvisor (if added)
  # Uncomment after adding cAdvisor service
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         service: 'container-metrics'

  # Node exporter for system metrics (if added)
  # Uncomment after adding node-exporter service
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node-exporter'

# ═══════════════════════════════════════════════════════════════
# DISABLED TARGETS - Require Additional Configuration/Exporters
# ═══════════════════════════════════════════════════════════════

